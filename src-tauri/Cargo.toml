[package]
name = "squeezegram"
version = "0.1.0"
description = "Compresses videos and photos and sends them to Telegram groups and topics."
edition = "2024"
rust-version = "1.90"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name (needed on Windows).
name = "squeezegram_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# Updates: the plugin downloads and checks the minisign signature against the public key in
# tauri.conf.json; it runs the NSIS installer, which restarts the app (no process plugin needed).
tauri-plugin-updater = "2.13"
# Version comparison (already in the tree through the updater and Tauri).
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
# CancellationToken for the orchestrator (current item, shutdown).
tokio-util = "0.7"
# Object-safe async traits: the orchestrator holds `Arc<dyn MediaStage>` and `Arc<dyn SendStage>`.
async-trait = "0.1"
# ISO 8601 UTC timestamps.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# ffmpeg sidecar download (blocking client, rustls, redirects, Range resume).
ureq = "3"
# SHA-256 of the downloaded archive, verified before extraction.
sha2 = "0.11"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Content identity `size:blake3`.
blake3 = { version = "1.8", features = ["rayon"] }
# TDLib transport: `tdjson.dll` loaded at run time (a release without it still starts, TG_LIB_MISSING).
libloading = "0.8"
# TDLib JSON `bytes` fields (database_encryption_key) are base64; license keys are base64url.
base64 = "0.22"
# License keys: Ed25519 verification only. No `rand_core`: the app never
# signs; `fast` keeps the precomputed tables of curve25519-dalek.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
# Structured journal: events and spans, our own JSON Lines layer and rolling
# file (the imposed schema, file name and size caps are not what `fmt().json()` and
# `tracing-appender` produce). `Targets` parses RUST_LOG without pulling in regex.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
# `session_id` of the journal (already in the tree through Tauri).
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Paused clock: pauses and FLOOD_WAIT delays run instantly and deterministically in tests.
tokio = { version = "1", features = ["test-util"] }

# Job Objects (KILL_ON_JOB_CLOSE) and process creation flags for tdl/ffmpeg children;
# DPAPI (CryptProtectData) and BCryptGenRandom for the TDLib database key; the registry for the
# Windows version written in the journal's `app_start`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
