# Weekly dependency updates. Patch and minor updates are grouped into one pull
# request per ecosystem; major updates arrive as separate pull requests.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Reviewed version, pinned by src/lib/installer-inno-build.test.ts;
      # bumped manually together with the Inno adapter review.
      - dependency-name: tauri-plugin-updater
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Reviewed version, pinned by src/lib/installer-inno-build.test.ts and
      # release.yml's standalone signer; bumped manually with the Inno adapter
      # review.
      - dependency-name: "@tauri-apps/cli"
      # Keep @types/node on the Node major used by CI.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
