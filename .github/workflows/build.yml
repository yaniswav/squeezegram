# Dry-run build: checks that the project installs, lints, type-checks and compiles.
# It publishes nothing and uses no secrets. Releases are built by release.yml.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the exact version pinned in the "packageManager" field of package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The release ships THIRD-PARTY-NOTICES.txt, generated from Cargo.lock and pnpm-lock.yaml.
      # Generating it here fails the build as soon as a dependency has no usable licence text,
      # instead of at release time. cargo-about is pinned in scripts/install-cargo-about.ps1.
      - name: Install cargo-about (pinned)
        shell: pwsh
        run: ./scripts/install-cargo-about.ps1

      - name: Generate third-party notices
        shell: pwsh
        run: ./scripts/generate-notices.ps1

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build front-end
        run: pnpm build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      # Unit tests only; tests marked #[ignore] stay ignored.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked --lib

      - name: Rust check
        working-directory: src-tauri
        run: cargo check --locked

      # Debug profile, no installer: fast compile check of the whole app.
      - name: Build app (no bundle)
        run: pnpm tauri build --debug --no-bundle
