# Release build: runs only when a tag vX.Y.Z is pushed to this repository.
# It builds the installer and the portable zip, signs the installer for the updater in a
# separate job and creates a DRAFT GitHub release. It never publishes: the owner reviews the
# draft and publishes it by hand. Publishing the draft triggers publish-channel.yml, which copies
# latest.json to the update channel release channel-v<N> that the app reads.
#
# Secrets used (never written to a file or printed). Each environment waits for the owner's
# approval and only accepts v* tags:
#   environment "release":          SQUEEZEGRAM_TG_API_ID, SQUEEZEGRAM_TG_API_HASH
#                                   compiled into the executable by build.rs; only the "Build"
#                                   step of the build job sees them
#   environment "release-signing":  TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD), the updater key;
#                                   only the signing step of the sign job sees it
# The build job (pnpm, cargo, crates, build.rs, Inno) never sees the signing key. The sign job
# runs nothing from the project's dependency tree. The job that creates the release has
# contents: write and no secret. No job uses a cache: a release build must not consume what
# another workflow wrote.
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # tdjson.dll (TDLib 1.8.68) is an asset of a release of this repository, published once
  # with scripts/publish-tdjson.ps1. Its SHA-256 is the same pin as in
  # scripts/stage-tdjson.ps1 and src-tauri/src/transport/tdlib/library.rs.
  TDJSON_URL: https://github.com/${{ github.repository }}/releases/download/tdjson-1.8.68/tdjson.dll
  TDJSON_SHA256: 048af1d1c97ef9b860dd5de132c4d2d901d444691ec86fc15012e5896dbde6b8

jobs:
  build:
    name: Build
    # The Telegram identity lives in the "release" environment, which only accepts v* tags
    # and waits for the owner's approval before this job starts. The signing key is not here.
    environment: release
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer_sha256: ${{ steps.installer.outputs.installer_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check that the tagged commit is on main
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::error::Could not fetch origin/main; refusing the release build.'
            exit 1
          }
          git merge-base --is-ancestor $env:COMMIT_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::error::The tagged commit is not on origin/main; refusing the release build.'
            exit 1
          }

      # Installs the exact version pinned in the "packageManager" field of package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      # The tag must be vX.Y.Z with X.Y.Z the version shared by package.json, Cargo.toml and
      # tauri.conf.json (scripts/check-versions.ps1 fails if those three differ).
      - name: Check that the tag matches the project version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -ne 'tag') { throw "Not a tag: $env:REF_TYPE" }
          $version = & ./scripts/check-versions.ps1 | Select-Object -Last 1
          if ($env:REF_NAME -ne "v$version") {
            throw "Tag $env:REF_NAME does not match the project version v$version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Download, then refuse anything but the pinned build. install-tdjson.ps1 and
      # stage-tdjson.ps1 check the same hash again afterwards.
      - name: Download tdjson.dll and check its SHA-256
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tdjson-download'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $dll = Join-Path $dir 'tdjson.dll'
          Invoke-WebRequest -Uri $env:TDJSON_URL -OutFile $dll -MaximumRedirection 5
          $actual = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TDJSON_SHA256) {
            throw "tdjson.dll: SHA-256 $actual does not match the pinned $env:TDJSON_SHA256"
          }
          & ./scripts/install-tdjson.ps1 -FromFile $dll

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # scripts/build-release.ps1 generates THIRD-PARTY-NOTICES.txt with cargo-about. The version
      # is pinned in scripts/install-cargo-about.ps1 and compiled from crates.io with its own
      # lock file (checksum-verified). Installed here, before the step that sees the secrets.
      - name: Install cargo-about (pinned)
        shell: pwsh
        run: ./scripts/install-cargo-about.ps1

      # The Inno Setup compiler is downloaded here, before the step that sees the secrets, and
      # checked against its pinned SHA-256 and Authenticode signature. build-inno-installer.ps1
      # calls install-inno.ps1 again later and then only verifies the staged files again.
      - name: Install Inno Setup (pinned)
        shell: pwsh
        run: ./scripts/install-inno.ps1

      # The WebView2 bootstrapper the installer embeds goes where build-release.ps1 looks for it
      # (next to the staged tdjson.dll): it downloads nothing when the file is already there.
      # build-inno-installer.ps1 still refuses it unless it carries a valid Microsoft signature.
      - name: Download the WebView2 bootstrapper
        shell: pwsh
        run: |
          $dir = Join-Path 'src-tauri' 'target/release-stage'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile (Join-Path $dir 'MicrosoftEdgeWebview2Setup.exe') -MaximumRedirection 5

      # A release never trusts the test bot's key t1: the feature must not be a default feature
      # nor appear in the release script.
      - name: Refuse the test-keyring feature
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json
          $pkg = $meta.packages | Where-Object name -eq 'squeezegram'
          if ($pkg.features.default -contains 'test-keyring') { throw 'test-keyring is a default feature' }
          if (Select-String -Path scripts/build-release.ps1 -SimpleMatch 'test-keyring' -Quiet) { throw 'scripts/build-release.ps1 mentions test-keyring' }

      # The only step that sees the secrets. build-release.ps1 reads them from the
      # environment (build.rs does); nothing echoes them or writes them to a file, and no
      # shell tracing is on. Without TAURI_SIGNING_PRIVATE_KEY it builds an unsigned installer;
      # the sign job signs it.
      # It downloads no tool and runs no binary fetched in this step: Inno Setup and the
      # bootstrapper arrive in the two steps above and are only verified here. (Cargo still
      # fetches the crates of Cargo.lock, checksum-verified.)
      # It also generates THIRD-PARTY-NOTICES.txt (installer and zip) and fails if a crate or
      # package has no licence text.
      - name: Build installer, portable zip and checksums
        shell: pwsh
        env:
          SQUEEZEGRAM_TG_API_ID: ${{ secrets.SQUEEZEGRAM_TG_API_ID }}
          SQUEEZEGRAM_TG_API_HASH: ${{ secrets.SQUEEZEGRAM_TG_API_HASH }}
        run: |
          foreach ($name in 'SQUEEZEGRAM_TG_API_ID', 'SQUEEZEGRAM_TG_API_HASH') {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) {
              throw "The repository secret $name is not set"
            }
          }
          & ./scripts/build-release.ps1

      # The sign job signs exactly these bytes: it recomputes this hash and refuses a mismatch.
      - name: Hash the installer
        id: installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Join-Path 'dist-release' "squeezegram-$env:VERSION-setup-x64.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "installer_sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Write the release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          & ./scripts/render-release-notes.ps1 -Version $env:VERSION -Tag $env:REF_NAME -Repository $env:REPOSITORY

      # Handed to the sign job. A short retention keeps an abandoned draft's files from
      # lingering as workflow artifacts.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-unsigned
          path: |
            dist-release/squeezegram-${{ steps.version.outputs.version }}-setup-x64.exe
            dist-release/squeezegram-${{ steps.version.outputs.version }}-portable-x64.zip
            dist-release/SHA256SUMS.txt
            dist-release/release-notes.md
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign installer
    needs: build
    # Holds the updater signing key and nothing else: no node, pnpm, Rust, cache or project
    # install, so no dependency of the project runs next to the key. The only code it runs is
    # the scripts/ folder of this tag and a pinned tauri-cli binary.
    environment: release-signing
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Standalone tauri-cli 2.12.1 (asset of the tauri-cli-v2.12.1 release of tauri-apps/tauri).
      TAURI_CLI_URL: https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.1/cargo-tauri-x86_64-pc-windows-msvc.zip
      TAURI_CLI_SHA256: d3919ebe0bf7013dd98293862784dd37b8f76db2d650e13a3ec11c5dd799c519
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check that signing is for a tag on main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:REF -cnotlike 'refs/tags/v*') {
            Write-Output '::error::Signing requires a refs/tags/v* ref.'
            exit 1
          }
          $status = & gh api "repos/$env:REPOSITORY/compare/main...$env:COMMIT_SHA" --jq '.status'
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::error::Could not compare the tagged commit with main; refusing to sign.'
            exit 1
          }
          if (@('identical', 'behind') -cnotcontains $status) {
            Write-Output '::error::The tagged commit is not on main; refusing to sign.'
            exit 1
          }

      # Only the scripts folder: make-latest-json.ps1 needs nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Download tauri-cli and check its SHA-256
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tauri-cli'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir 'cargo-tauri.zip'
          Invoke-WebRequest -Uri $env:TAURI_CLI_URL -OutFile $zip -MaximumRedirection 5
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TAURI_CLI_SHA256) {
            throw "tauri-cli: SHA-256 $actual does not match the pinned $env:TAURI_CLI_SHA256"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          if (-not (Test-Path -LiteralPath (Join-Path $dir 'cargo-tauri.exe') -PathType Leaf)) { throw 'cargo-tauri.exe missing from the archive' }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-unsigned
          path: dist-release

      # The build job hashed the installer before upload; sign only those bytes.
      - name: Check the installer against the build job
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.installer_sha256 }}
        run: |
          $installer = Join-Path 'dist-release' "squeezegram-$env:VERSION-setup-x64.exe"
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ([string]::IsNullOrEmpty($env:EXPECTED_SHA256) -or $actual -ne $env:EXPECTED_SHA256) {
            throw "Installer: SHA-256 $actual does not match the build job's '$env:EXPECTED_SHA256'"
          }

      # The only step that sees the signing key. The pinned binary reads it from the
      # environment; nothing echoes it or writes it to a file, and no shell tracing is on.
      - name: Sign the installer for the updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'The secret TAURI_SIGNING_PRIVATE_KEY is not set'
          }
          $installer = Join-Path 'dist-release' "squeezegram-$env:VERSION-setup-x64.exe"
          & (Join-Path $env:RUNNER_TEMP 'tauri-cli/cargo-tauri.exe') signer sign --app-version $env:VERSION $installer
          if ($LASTEXITCODE -ne 0) { throw "tauri signer sign failed with exit code $LASTEXITCODE" }

      # Shared with channel publication: require the expected file/version in the trusted
      # comment and a structurally valid minisign envelope. This does not verify Ed25519.
      - name: Check the signature structure and binding
        shell: pwsh
        run: |
          . ./scripts/lib/updater-signature.ps1
          $name = "squeezegram-$env:VERSION-setup-x64.exe"
          $sig = Join-Path 'dist-release' "$name.sig"
          $signature = (Get-Content -LiteralPath $sig -Raw).Trim()
          Assert-UpdaterSignature -Signature $signature -Version $env:VERSION -AssetName $name

      - name: Write latest.json
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $sig = Join-Path 'dist-release' "squeezegram-$env:VERSION-setup-x64.exe.sig"
          & ./scripts/make-latest-json.ps1 -Version $env:VERSION -Tag $env:REF_NAME -Repository $env:REPOSITORY -SignatureFile $sig

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            dist-release/squeezegram-${{ needs.build.outputs.version }}-setup-x64.exe
            dist-release/squeezegram-${{ needs.build.outputs.version }}-setup-x64.exe.sig
            dist-release/squeezegram-${{ needs.build.outputs.version }}-portable-x64.zip
            dist-release/SHA256SUMS.txt
            dist-release/latest.json
            dist-release/release-notes.md
          if-no-files-found: error
          retention-days: 1

  draft-release:
    name: Create draft release
    needs: [build, sign]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release-files

      # A draft is invisible to the public and to the updater until the owner publishes it.
      # --verify-tag refuses to create a tag; the command fails if a release for this tag
      # already exists, so nothing is overwritten. A version with a suffix (0.1.0-beta.1)
      # is marked as a pre-release.
      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # gh release create does not refuse a second draft for the same tag: check first.
          $existing = & gh release list --repo $env:REPOSITORY --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw "gh release list failed with exit code $LASTEXITCODE" }
          if (@($existing) -contains $env:REF_NAME) { throw "A release or draft already exists for $env:REF_NAME" }
          $dir = 'release-files'
          $assets = @(
            "squeezegram-$env:VERSION-setup-x64.exe",
            "squeezegram-$env:VERSION-setup-x64.exe.sig",
            "squeezegram-$env:VERSION-portable-x64.zip",
            'SHA256SUMS.txt',
            'latest.json'
          ) | ForEach-Object {
            $path = Join-Path $dir $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release file: $path" }
            $path
          }
          $notes = Join-Path $dir 'release-notes.md'
          $flags = @('--draft', '--verify-tag', '--title', "squeezegram $env:VERSION", '--notes-file', $notes)
          if ($env:VERSION -match '-') { $flags += '--prerelease' }
          & gh release create $env:REF_NAME --repo $env:REPOSITORY @flags @assets
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          Write-Host "Draft release created for $env:REF_NAME. Review it, write the notes, then publish it by hand."
