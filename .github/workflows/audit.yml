# Dependency audit: known advisories, licences and sources.
# Reads the repository only; no secrets, nothing is published.
name: audit

on:
  push:
  pull_request:
  schedule:
    # Mondays 06:00 UTC. New advisories appear without any code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uses src-tauri/deny.toml: advisories, licences, bans and sources for
      # the x86_64-pc-windows-msvc dependency graph.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ./src-tauri/Cargo.toml
          command: check
          arguments: --all-features

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the exact version pinned in the "packageManager" field of package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Audits the lockfile against the registry advisory database.
      # Fails on any known vulnerability.
      - name: Audit JavaScript dependencies
        run: pnpm audit
